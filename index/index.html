<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CLM - 证书生命周期管理系统 / Certificate Lifecycle Management System" />
  <title>CLM - Certificate Lifecycle Management System</title>
  <style>
    :root {
      --bg: #f7fbff;
      --text: #16345f;
      --muted: #607695;
      --primary: #2479f3;
      --secondary: #39c7bc;
      --line: rgba(36, 121, 243, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 38%, rgba(66, 158, 255, 0.11), transparent 28%),
        radial-gradient(circle at 77% 28%, rgba(57, 199, 188, 0.07), transparent 22%),
        linear-gradient(180deg, #fbfdff 0%, #f5faff 100%);
    }

    .page {
      position: relative;
      z-index: 2;
      width: min(920px, 92vw);
      padding: 48px 24px;
      text-align: center;
    }

    .brand {
      margin: 0;
      font-size: clamp(88px, 17vw, 180px);
      line-height: 0.9;
      letter-spacing: 0.04em;
      font-weight: 800;
      background: linear-gradient(115deg, #1e6ef2 18%, #2d98eb 52%, #43cdb8 82%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 12px 18px rgba(34, 111, 220, 0.15));
      user-select: none;
    }

    .divider {
      width: 82px;
      height: 3px;
      margin: 32px auto 34px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }

    .title-cn {
      margin: 0;
      font-size: clamp(28px, 4.2vw, 48px);
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .title-en {
      margin: 12px 0 0;
      font-size: clamp(16px, 2.4vw, 25px);
      line-height: 1.5;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .contact {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 42px;
      padding: 15px 28px;
      border: 1px solid transparent;
      border-radius: 14px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 650;
      color: #0d65cb;
      background:
        linear-gradient(#ffffff, #ffffff) padding-box,
        linear-gradient(100deg, var(--primary), var(--secondary)) border-box;
      box-shadow: 0 10px 30px rgba(37, 116, 215, 0.10);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background-color 0.2s ease;
    }

    .contact:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(37, 116, 215, 0.16);
    }

    .contact:focus-visible {
      outline: 3px solid rgba(36, 121, 243, 0.22);
      outline-offset: 4px;
    }

    .contact svg {
      width: 21px;
      height: 21px;
      flex: 0 0 auto;
    }

    .hint {
      margin-top: 18px;
      color: #7a8da7;
      font-size: 14px;
      line-height: 1.7;
    }

    .wave {
      position: fixed;
      inset: auto 0 0;
      z-index: 1;
      width: 100%;
      height: 38vh;
      pointer-events: none;
      opacity: 0.7;
    }

    .orb {
      position: fixed;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.12;
      pointer-events: none;
    }

    .orb.one {
      top: -100px;
      left: -110px;
      background: #5ca8ff;
    }

    .orb.two {
      right: -100px;
      bottom: -120px;
      background: #45cdbb;
    }

    @media (max-width: 640px) {
      .page {
        padding: 34px 18px;
      }

      .divider {
        margin-top: 26px;
        margin-bottom: 28px;
      }

      .contact {
        margin-top: 34px;
        padding: 13px 22px;
        font-size: 16px;
      }

      .hint {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="orb one"></div>
  <div class="orb two"></div>

  <main class="page">
    <h1 class="brand">CLM</h1>

    <div class="divider"></div>

    <h2 class="title-cn">证书生命周期管理系统</h2>
    <p class="title-en">Certificate Lifecycle Management System</p>

    <a
      class="contact"
      href="https://github.com/ssltrus-official"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="联系我们 / Contact Us"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M8.5 19.5 4 21l1.5-4.1A8 8 0 1 1 8.5 19.5Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="9" cy="11" r="1" fill="currentColor"/>
        <circle cx="12" cy="11" r="1" fill="currentColor"/>
        <circle cx="15" cy="11" r="1" fill="currentColor"/>
      </svg>
      <span>联系我们 / Contact Us</span>
    </a>

    <div class="hint">
      GitHub:
      <span>ssltrus-official</span>
    </div>
  </main>

  <svg class="wave" viewBox="0 0 1440 420" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="g1" x1="0" x2="1">
        <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.10"/>
        <stop offset="55%" stop-color="#4ea5f5" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#3ccbb7" stop-opacity="0.10"/>
      </linearGradient>
    </defs>
    <path
      d="M0,245 C200,170 350,315 560,242 C780,165 930,150 1110,228 C1260,293 1360,250 1440,210 L1440,420 L0,420 Z"
      fill="url(#g1)"
    />
    <path
      d="M0,292 C240,235 365,336 585,283 C775,237 900,211 1100,278 C1260,330 1375,284 1440,250"
      fill="none"
      stroke="#5da8f8"
      stroke-opacity="0.15"
      stroke-width="1.5"
    />
    <path
      d="M0,322 C235,270 392,350 612,312 C820,276 955,253 1140,309 C1285,353 1382,320 1440,298"
      fill="none"
      stroke="#42c7ba"
      stroke-opacity="0.12"
      stroke-width="1.4"
    />
  </svg>
</body>
</html>
